name: AlphaBugs BrowserStack E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  browserstack-tests:
    name: Run Cross-Browser Tests on BrowserStack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Playwright Tests on BrowserStack Automate
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BASE_URL: https://bugbash.online
          RUN_ON_BSTACK: "true"
          BSTACK_PROJECT_NAME: AlphaBugs
          BSTACK_BUILD_NAME: "GitHub Actions CI Run #${{ github.run_number }}"
        run: |
          pytest tests/ -v --tb=short
