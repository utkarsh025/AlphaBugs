[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --capture=no

markers =
    smoke: Smoke tests covering core critical paths
    regression: Comprehensive regression suite
    auth: Authentication and persona tests
    catalog: Product catalog, search, and filtering tests
    cart: Cart operations and drawer interactions
    checkout: Checkout flow and order placement
    edge_case: Boundary, edge case, and negative scenarios
    bug: Explicit bug verification tests documenting application flaws
    bstack_tm: BrowserStack Test Management mapped test case
